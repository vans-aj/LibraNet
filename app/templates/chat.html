<div class="chat-widget">
    <button type="button" class="chat-toggle-btn" id="chatToggle" aria-label="Toggle chat">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
    </button>
    
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar">💬</div>
                <div class="chat-title">
                    <div class="chat-name">LibraNet Chat</div>
                    <div class="chat-status">Always available</div>
                </div>
            </div>
            <button type="button" class="chat-close" id="chatClose" aria-label="Close chat">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="chat-message bot">
                <div class="message-content">
                    <div class="message-bubble">
                        Hi! How can I help you today?
                    </div>
                </div>
            </div>
        </div>
        
        <div class="quick-replies">
            <div class="quick-replies-title">Quick questions</div>
            <div class="quick-replies-buttons">
                <button type="button" class="quick-reply-btn" data-message="How do I borrow a book?">Borrow a book</button>
                <button type="button" class="quick-reply-btn" data-message="What are subscription plans?">Subscription plans</button>
                <button type="button" class="quick-reply-btn" data-message="How to return books?">Return books</button>
            </div>
        </div>
        
        <div class="chat-input-wrapper">
            <form class="chat-input-form" id="chatForm">
                <textarea 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Type a message..." 
                    rows="1"
                    aria-label="Chat message"
                ></textarea>
                <button type="submit" class="chat-send-btn" id="chatSend" aria-label="Send message">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>
