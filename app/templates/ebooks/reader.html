{% extends "base.html" %}

{% block title %}Reading: {{ ebook.title }}{% endblock %}

{% block extra_css %}
<style>
    /* Reader Container */
    .ebook-reader {
        min-height: 100vh;
        padding: 2rem 1rem;
        background: var(--color-bg);
    }

    .reader-wrapper {
        max-width: 900px;
        margin: 0 auto;
        background: var(--color-surface);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] .reader-wrapper {
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .reader-header {
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .reader-title-section h2 {
        color: white;
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0;
    }

    .reader-title-section p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.9rem;
        margin: 0.25rem 0 0;
    }

    .close-btn {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1.25rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .close-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
    }

    .reader-content {
        padding: 3rem 2.5rem;
        font-family: 'Georgia', 'Merriweather', serif;
        line-height: 1.9;
        font-size: 1.1rem;
        color: var(--color-text);
        min-height: 600px;
        max-height: 65vh;
        overflow-y: auto;
        background: var(--color-surface);
    }

    [data-theme="dark"] .reader-content {
        color: #e2e8f0;
        background: #1a1d2e;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .reader-content p {
        margin-bottom: 1.5rem;
        text-align: justify;
    }

    .reader-content::-webkit-scrollbar {
        width: 8px;
    }

    .reader-content::-webkit-scrollbar-track {
        background: var(--color-bg);
        border-radius: 4px;
    }

    .reader-content::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 4px;
    }

    [data-theme="dark"] .reader-content::-webkit-scrollbar-track {
        background: #0f1419;
    }

    .loading-state {
        text-align: center;
        padding: 4rem 0;
    }

    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--color-bg);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        margin-top: 1rem;
        color: var(--color-text-muted);
        font-size: 1rem;
    }

    .error-state {
        text-align: center;
        padding: 4rem 2rem;
    }

    .error-icon {
        font-size: 3rem;
        color: #ef4444;
        margin-bottom: 1rem;
    }

    .error-text {
        color: var(--color-text-muted);
        margin: 0.5rem 0;
    }

    .reader-navigation {
        background: var(--color-bg-secondary);
        padding: 1.25rem 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        border-top: 1px solid var(--color-border);
        flex-wrap: wrap;
    }

    [data-theme="dark"] .reader-navigation {
        background: #0f1419;
        border-top-color: #2d3748;
    }

    .nav-btn {
        padding: 0.75rem 2rem;
        background: var(--color-primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.95rem;
    }

    .nav-btn:hover:not(:disabled) {
        background: var(--color-primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .nav-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .page-info {
        padding: 0.75rem 1.5rem;
        background: var(--color-surface);
        border: 2px solid var(--color-primary);
        color: var(--color-primary);
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
    }

    [data-theme="dark"] .page-info {
        background: #1a1d2e;
    }

    .progress-container {
        height: 5px;
        background: var(--color-bg);
    }

    [data-theme="dark"] .progress-container {
        background: #0f1419;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--color-primary) 0%, #8b5cf6 100%);
        width: 0%;
        transition: width 0.3s ease;
    }

    @media (max-width: 768px) {
        .ebook-reader {
            padding: 1rem 0.5rem;
        }
        .reader-content {
            padding: 2rem 1.5rem;
            font-size: 1rem;
            max-height: 60vh;
        }
        .reader-header {
            padding: 1rem 1.5rem;
        }
        .reader-title-section h2 {
            font-size: 1.1rem;
        }
        .reader-navigation {
            padding: 1rem;
            gap: 1rem;
        }
        .nav-btn {
            padding: 0.6rem 1.25rem;
            font-size: 0.9rem;
        }
        .page-info {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }
    }

    /* Word Meaning Styles */
    .word-lookup-btn {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
        border: none;
        border-radius: 50%;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    .word-lookup-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .word-lookup-btn svg {
        width: 28px;
        height: 28px;
        color: white;
    }

    .meaning-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .meaning-modal.active {
        display: flex;
    }

    .meaning-content {
        background: var(--color-surface);
        border-radius: 16px;
        width: 100%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s ease;
    }

    [data-theme="dark"] .meaning-content {
        background: #1a1d2e;
        border: 1px solid #2d3748;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .meaning-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid var(--color-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    [data-theme="dark"] .meaning-header {
        border-bottom-color: #2d3748;
    }

    .meaning-header h3 {
        margin: 0;
        color: var(--color-text);
        font-size: 1.25rem;
        font-weight: 700;
    }

    .close-modal-btn {
        background: none;
        border: none;
        color: var(--color-text-muted);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        transition: all 0.2s;
    }

    .close-modal-btn:hover {
        background: var(--color-bg);
        color: var(--color-text);
    }

    .meaning-body {
        padding: 2rem;
    }

    .word-input-group {
        margin-bottom: 1.5rem;
    }

    .word-input-label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--color-text);
        font-weight: 600;
        font-size: 0.95rem;
    }

    .word-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 2px solid var(--color-border);
        border-radius: 8px;
        font-size: 1rem;
        background: var(--color-bg);
        color: var(--color-text);
        transition: all 0.3s;
    }

    .word-input:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    [data-theme="dark"] .word-input {
        background: #0f1419;
        border-color: #2d3748;
    }

    .lookup-btn {
        width: 100%;
        padding: 0.875rem;
        background: var(--color-primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .lookup-btn:hover:not(:disabled) {
        background: var(--color-primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .lookup-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .meaning-result {
        margin-top: 1.5rem;
        padding: 1.5rem;
        background: var(--color-bg);
        border-radius: 8px;
        border-left: 4px solid var(--color-primary);
        display: none;
    }

    [data-theme="dark"] .meaning-result {
        background: #0f1419;
    }

    .meaning-result.show {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .meaning-text {
        color: var(--color-text);
        line-height: 1.8;
        white-space: pre-line;
    }

    .meaning-loading {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--color-text-muted);
        font-size: 0.95rem;
    }

    .meaning-spinner {
        width: 20px;
        height: 20px;
        border: 3px solid var(--color-bg);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .error-message {
        margin-top: 1rem;
        padding: 1rem;
        background: #fee;
        border-left: 4px solid #ef4444;
        border-radius: 8px;
        color: #dc2626;
        font-size: 0.9rem;
        display: none;
    }

    [data-theme="dark"] .error-message {
        background: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
    }

    .error-message.show {
        display: block;
    }

    @media (max-width: 768px) {
        .word-lookup-btn {
            bottom: 80px;
            right: 20px;
            width: 50px;
            height: 50px;
        }
        .word-lookup-btn svg {
            width: 24px;
            height: 24px;
        }
        .meaning-content {
            max-height: 90vh;
        }
        .meaning-body {
            padding: 1.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="ebook-reader">
    <div class="reader-wrapper">
        <div class="reader-header">
            <div class="reader-title-section">
                <h2>{{ ebook.title }}</h2>
                <p>by {{ ebook.author }}</p>
            </div>
            <div class="reader-controls">
                <a href="{{ url_for('main.ebook_detail', ebook_id=ebook.id) }}" class="close-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                    Close
                </a>
            </div>
        </div>

        <div id="readerContent" class="reader-content">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p class="loading-text">Loading your book...</p>
            </div>
        </div>

        <div class="reader-navigation">
            <button id="prevBtn" class="nav-btn" onclick="previousPage()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Previous
            </button>
            <div id="pageInfo" class="page-info">Page 1</div>
            <button id="nextBtn" class="nav-btn" onclick="nextPage()">
                Next
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
</div>

<!-- Word Meaning Floating Button -->
<button class="word-lookup-btn" onclick="openMeaningModal()" title="Look up word or sentence meaning">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
    </svg>
</button>

<!-- Word Meaning Modal -->
<div id="meaningModal" class="meaning-modal">
    <div class="meaning-content">
        <div class="meaning-header">
            <h3>Word & Sentence Meaning</h3>
            <button class="close-modal-btn" onclick="closeMeaningModal()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 24px; height: 24px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="meaning-body">
            <div class="word-input-group">
                <label class="word-input-label" for="wordInput">Enter a word or sentence:</label>
                <input 
                    type="text" 
                    id="wordInput" 
                    class="word-input" 
                    placeholder="Type any word or sentence..."
                    onkeypress="if(event.key === 'Enter') lookupWord()"
                >
            </div>
            <button class="lookup-btn" onclick="lookupWord()" id="lookupBtn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                Get Meaning
            </button>
            <div id="errorMessage" class="error-message"></div>
            <div id="meaningResult" class="meaning-result">
                <div class="meaning-text" id="meaningText"></div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;
let linesPerPage = 35;
let bookLines = [];

async function loadEbook(url) {
    try {
        const proxyUrl = `{{ url_for('main.ebook_proxy') }}?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const text = await response.text();
        bookLines = text.split('\n').filter(line => line.trim() !== '');
        totalPages = Math.ceil(bookLines.length / linesPerPage);
        
        currentPage = 1;
        displayPage();
    } catch (error) {
        console.error('Error loading ebook:', error);
        document.getElementById('readerContent').innerHTML = `
            <div class="error-state">
                <div class="error-icon">⚠️</div>
                <p class="error-text" style="font-size: 1.1rem; font-weight: 600;">Failed to load ebook</p>
                <p class="error-text">The book content may not be available at this time.</p>
                <p class="error-text" style="font-size: 0.9rem;">Please try again later.</p>
            </div>
        `;
    }
}

function displayPage() {
    const startLine = (currentPage - 1) * linesPerPage;
    const endLine = Math.min(startLine + linesPerPage, bookLines.length);
    const pageContent = bookLines.slice(startLine, endLine);
    
    let formattedContent = '';
    let currentParagraph = '';
    
    pageContent.forEach(line => {
        if (line.trim() === '') {
            if (currentParagraph.trim()) {
                formattedContent += `<p>${escapeHtml(currentParagraph.trim())}</p>`;
                currentParagraph = '';
            }
        } else {
            currentParagraph += line + ' ';
        }
    });
    
    if (currentParagraph.trim()) {
        formattedContent += `<p>${escapeHtml(currentParagraph.trim())}</p>`;
    }
    
    document.getElementById('readerContent').innerHTML = formattedContent || '<p>No content to display.</p>';
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    
    const progress = (currentPage / totalPages) * 100;
    document.getElementById('progressBar').style.width = `${progress}%`;
    
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = currentPage === totalPages;
    
    document.getElementById('readerContent').scrollTop = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function nextPage() {
    if (currentPage < totalPages) {
        currentPage++;
        displayPage();
    }
}

function previousPage() {
    if (currentPage > 1) {
        currentPage--;
        displayPage();
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        nextPage();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        previousPage();
    }
});

// Word Meaning Modal Functions
function openMeaningModal() {
    document.getElementById('meaningModal').classList.add('active');
    document.getElementById('wordInput').focus();
    // Clear previous results
    document.getElementById('meaningResult').classList.remove('show');
    document.getElementById('errorMessage').classList.remove('show');
    document.getElementById('wordInput').value = '';
}

function closeMeaningModal() {
    document.getElementById('meaningModal').classList.remove('active');
}

// Close modal when clicking outside
document.getElementById('meaningModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeMeaningModal();
    }
});

async function lookupWord() {
    const wordInput = document.getElementById('wordInput');
    const word = wordInput.value.trim();
    const lookupBtn = document.getElementById('lookupBtn');
    const meaningResult = document.getElementById('meaningResult');
    const meaningText = document.getElementById('meaningText');
    const errorMessage = document.getElementById('errorMessage');
    
    // Hide previous results
    meaningResult.classList.remove('show');
    errorMessage.classList.remove('show');
    
    if (!word) {
        errorMessage.textContent = 'Please enter a word or sentence.';
        errorMessage.classList.add('show');
        return;
    }
    
    // Show loading state
    lookupBtn.disabled = true;
    lookupBtn.innerHTML = `
        <div class="meaning-spinner"></div>
        Looking up...
    `;
    
    try {
        const response = await fetch('/api/word-meaning', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ word: word })
        });
        
        const data = await response.json();
        
        if (data.success) {
            meaningText.textContent = data.meaning;
            meaningResult.classList.add('show');
        } else {
            errorMessage.textContent = data.error || 'Failed to get word meaning.';
            errorMessage.classList.add('show');
        }
    } catch (error) {
        errorMessage.textContent = 'Network error. Please try again.';
        errorMessage.classList.add('show');
    } finally {
        // Restore button state
        lookupBtn.disabled = false;
        lookupBtn.innerHTML = `
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Get Meaning
        `;
    }
}

{% if txt_format %}
loadEbook('{{ txt_format.content_url }}');
{% else %}
document.getElementById('readerContent').innerHTML = `
    <div class="error-state">
        <div class="error-icon">📚</div>
        <p class="error-text" style="font-size: 1.1rem; font-weight: 600;">No TXT format available</p>
        <p class="error-text">This ebook is not available in text format.</p>
    </div>
`;
{% endif %}
</script>
{% endblock %}
