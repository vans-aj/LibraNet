{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="container" style="max-width: 860px; margin: 2rem auto;">
  <h1>My Profile</h1>
  <div class="profile-card" style="background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 1.5rem;">
    <p style="margin-bottom: 1rem;"><strong>Name:</strong> {{ current_user.name }}</p>
    <p style="margin-bottom: 1rem;"><strong>Email:</strong> {{ current_user.email }}</p>
    <p style="margin-bottom: 0;"><strong>Roll no:</strong> {{ current_user.roll_no }}</p>
  </div>
</div>
{% endblock %}
